server:
  port: ${PORT:8085}

spring:
  application:
    name: ai-analysis-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/healthverse}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
  expiration: 86400000 # 24 hours

ai:
  provider: ${AI_PROVIDER:ollama}
  model: ${AI_MODEL:qwen2.5:7b}
