services:
  # Infrastructure
  postgresql:
    image: postgres:15-alpine
    container_name: healthverse-postgresql
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthverse-net

  mongodb:
    image: mongo:6
    container_name: healthverse-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - healthverse-net

  redis:
    image: redis:7-alpine
    container_name: healthverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - healthverse-net


  # Services
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: healthverse-discovery-server
    ports:
      - "8761:8761"
    environment:
      - PORT=8761
    networks:
      - healthverse-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: healthverse-api-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
    depends_on:
      - discovery-server
    networks:
      - healthverse-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: healthverse-auth-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgresql
      - discovery-server
    networks:
      - healthverse-net

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: healthverse-user-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AI_AGENT_URL=http://ai-agent-service:8000
    depends_on:
      - postgresql
      - redis
      - discovery-server
    networks:
      - healthverse-net


  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: healthverse-report-service
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - MONGODB_URI=${MONGODB_URI}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
      - discovery-server
    networks:
      - healthverse-net

  ai-analysis-service:
    build:
      context: ./ai-analysis-service
      dockerfile: Dockerfile
    container_name: healthverse-ai-analysis-service
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - MONGODB_URI=${MONGODB_URI}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AI_AGENT_URL=http://ai-agent-service:8000
    depends_on:
      - mongodb
      - discovery-server
    networks:
      - healthverse-net

  nutrition-fitness-service:
    build:
      context: ./nutrition-fitness-service
      dockerfile: Dockerfile
    container_name: healthverse-nutrition-fitness-service
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AI_AGENT_URL=http://ai-agent-service:8000
    depends_on:
      - postgresql
      - discovery-server
    networks:
      - healthverse-net

  wellness-service:
    build:
      context: ./wellness-service
      dockerfile: Dockerfile
    container_name: healthverse-wellness-service
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AI_AGENT_URL=http://ai-agent-service:8000
    depends_on:
      - postgresql
      - discovery-server
    networks:
      - healthverse-net


  ai-agent-service:
    build:
      context: ../ai-agents
      dockerfile: Dockerfile
    container_name: healthverse-ai-agent-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
    networks:
      - healthverse-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  healthverse-net:
    driver: bridge



