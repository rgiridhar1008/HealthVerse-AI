server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 60000
        response-timeout: 300s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"
              - "http://127.0.0.1:5173"
              - "http://localhost:5174"
              - "http://127.0.0.1:5174"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "PATCH"
              - "OPTIONS"
              - "HEAD"
            allowedHeaders:
              - "Content-Type"
              - "Authorization"
              - "Accept"
              - "Origin"
              - "X-Requested-With"
              - "Access-Control-Request-Method"
              - "Access-Control-Request-Headers"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - SecureHeaders
      routes:
        - id: auth-service-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: user-service-users-route
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: user-service-health-route
          uri: lb://user-service
          predicates:
            - Path=/api/health/**,/api/health-twin/**

        - id: wellness-service-route
          uri: lb://wellness-service
          predicates:
            - Path=/api/wellness/**


        - id: nutrition-fitness-service-route
          uri: lb://nutrition-fitness-service
          predicates:
            - Path=/api/nutrition/**,/api/fitness/**

        - id: report-service-route
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**

        - id: ai-analysis-service-route
          uri: lb://ai-analysis-service
          predicates:
            - Path=/api/analysis/**

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.web.cors: DEBUG
    com.healthverse: DEBUG
